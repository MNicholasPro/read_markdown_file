<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Markdown Reader</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
</head>
<body>
    <div id="app">
        <!-- Custom Title Bar -->
        <header id="title-bar">
            <div class="drag-region">
                <button id="btn-toggle-sidebar" class="sidebar-toggle-btn">≡</button>
                <span class="app-title">Markdown Pro Reader</span>
            </div>
            <div class="window-controls">
                <button id="btn-minimize">—</button>
                <button id="btn-maximize">▢</button>
                <button id="btn-close">×</button>
            </div>
        </header>

        <main id="main-container">
            <!-- Control Panel -->
            <aside id="control-panel">
                <div class="panel-section">
                    <h3>Files</h3>
                    <button id="btn-open" class="primary-btn">Open Markdown File</button>
                </div>
                <div class="panel-section">
                    <h3>Outline</h3>
                    <ul id="toc-list" class="toc-list"></ul>
                </div>
                <div class="panel-section">
                    <h3>Search</h3>
                    <div id="search-bar" class="search-bar">
                        <input type="text" id="search-input" placeholder="Search content...">
                        <div class="search-controls">
                            <button id="btn-search-prev" class="search-btn" title="Previous (Shift+Enter)">Prev</button>
                            <button id="btn-search-next" class="search-btn" title="Next (Enter)">Next</button>
                            <span id="search-status">0 / 0</span>
                        </div>
                    </div>
                </div>
                <div class="panel-section">
                    <h3>Font Size</h3>
                    <div class="font-size-controls">
                        <input type="range" id="font-size-slider" min="12" max="32" value="18">
                        <span id="font-size-value">18px</span>
                    </div>
                </div>
                <div class="panel-section">
                    <div id="history-header" class="history-header">
                        <button id="btn-add-collection" class="icon-btn" title="Add Collection">+</button>
                        <h3 id="btn-view-history">History</h3>
                        <div id="collection-tabs" class="collection-tabs"></div>
                    </div>
                    <ul id="history-list" class="history-list"></ul>
                </div>
                <div class="panel-section">
                    <h3>Theme</h3>
                    <button id="btn-toggle-theme" class="secondary-btn">Switch Theme</button>
                    <!-- <p style="font-size: 12px; margin-top: 10px;">GitHub Light/Dark Theme<br>Click to switch</p> -->
                </div>
                <div class="panel-section footer">
                    <p>v1.0.0 | Glassmorphism UI</p>
                </div>
            </aside>

            <!-- Content Area -->
            <section id="content-viewer">
                <div id="markdown-body" class="markdown-body">
                    <div class="welcome-screen">
                        <h1>Welcome to Markdown Pro</h1>
                        <p>Please open a markdown file to start reading.</p>
                    </div>
                </div>
            </section>
        </main>

        <!-- Fullscreen Mermaid Dialog -->
        <dialog id="mermaid-fullscreen" class="fullscreen-dialog">
            <!-- 关闭按钮 -->
            <button id="btn-close-fullscreen">×</button>
            <!-- 全屏绘图视口 -->
            <div id="fullscreen-content"></div>
        </dialog>
    </div>

        <!-- New Collection Name Dialog -->
        <dialog id="dialog-new-collection" class="custom-dialog">
            <div class="dialog-content">
                <h4>New Collection</h4>
                <input type="text" id="input-collection-name" placeholder="Enter collection name...">
                <div class="dialog-actions">
                    <button id="btn-cancel-collection" class="secondary-btn">Cancel</button>
                    <button id="btn-save-collection" class="primary-btn">Save</button>
                </div>
            </div>
        </dialog>

        <!-- Select Collection Dialog -->
        <dialog id="dialog-select-collection" class="custom-dialog">
            <div class="dialog-content">
                <h4>Add to Collection</h4>
                <div id="collection-select-list" class="collection-select-list"></div>
                <div class="dialog-actions">
                    <button id="btn-cancel-select" class="secondary-btn">Cancel</button>
                </div>
            </div>
        </dialog>

        <!-- Libraries -->
        <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
        <script src="renderer.js"></script>
        <!-- 在 index.html 的 </body> 之前添加 -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    </body>
    </html>
