<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Markdown Reader</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
</head>
<body>
    <div id="app">
        <!-- Custom Title Bar -->
        <header id="title-bar">
            <div class="drag-region">
                <button id="btn-toggle-sidebar" class="sidebar-toggle-btn">≡</button>
                <span class="app-title">Markdown Pro Reader</span>
            </div>
            <div class="window-controls">
                <button id="btn-minimize">—</button>
                <button id="btn-maximize">▢</button>
                <button id="btn-close">×</button>
            </div>
        </header>

        <main id="main-container">
            <!-- Control Panel -->
            <aside id="control-panel">
                <div class="panel-section">
                    <h3>Files</h3>
                    <button id="btn-open" class="primary-btn">Open Markdown File</button>
                </div>
                <div class="panel-section">
                    <h3>History</h3>
                    <ul id="history-list" class="history-list"></ul>
                </div>
                <div class="panel-section">
                    <h3>Theme</h3>
                    <button id="btn-toggle-theme" class="secondary-btn">Switch Theme</button>
                    <!-- <p style="font-size: 12px; margin-top: 10px;">GitHub Light/Dark Theme<br>Click to switch</p> -->
                </div>
                <div class="panel-section footer">
                    <p>v1.0.0 | Glassmorphism UI</p>
                </div>
            </aside>

            <!-- Content Area -->
            <section id="content-viewer">
                <div id="markdown-body" class="markdown-body">
                    <div class="welcome-screen">
                        <h1>Welcome to Markdown Pro</h1>
                        <p>Please open a markdown file to start reading.</p>
                    </div>
                </div>
            </section>
        </main>

        <!-- Fullscreen Mermaid Dialog -->
        <dialog id="mermaid-fullscreen" class="fullscreen-dialog">
            <!-- 关闭按钮 -->
            <button id="btn-close-fullscreen">×</button>
            <!-- 全屏绘图视口 -->
            <div id="fullscreen-content"></div>
        </dialog>
    </div>

    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="renderer.js"></script>
</body>
</html>
